<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Menu Options | Crumb & Crust</title>
    <meta name="description" content="Explore our live bakery inventory. Filter our selection easily by Gluten-Free, Vegan, or traditional items.">
    <meta name="author" content="Clive Simbarashe Musika">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/small.css" media="screen and (max-width: 767px)">
    <link rel="stylesheet" href="styles/large.css" media="screen and (min-width: 768px)">
</head>
<body>
    <header>
        <h1>Crumb & Crust</h1>
        <button id="menu-toggle" aria-label="Toggle Menu">☰</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" class="active">Our Menu</a></li>
                <li><a href="order.html">Catering Requests</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 style="color: var(--accent-honey); margin-bottom: 1.5rem;">Our Daily Inventory</h2>
        <div class="filters">
            <button id="filter-all" class="filter-btn">Show All</button>
            <button id="filter-gf" class="filter-btn">Gluten-Free</button>
            <button id="filter-vegan" class="filter-btn">Vegan</button>
        </div>
        <div id="menu-grid" class="grid-container"></div>
    </main>

    <div id="detail-modal" class="modal" aria-hidden="true" role="dialog">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>
            <h3 id="modal-title" style="color: var(--accent-honey); margin-bottom: 1rem;">Item Title</h3>
            <p id="modal-description">Detailed descriptive properties drop here.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Clive Simbarashe Musika | Crumb & Crust Bakery</p>
        <p><a href="https://loom.com/your-video-link" target="_blank">Project Video Demo</a></p>
    </footer>

    <script type="module" src="scripts/menu-module.js"></script>
</body>
</html>
