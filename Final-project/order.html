<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering Order Requests | Crumb & Crust</title>
    <meta name="description" content="Organizing a workshop or morning meeting? Fill out our customization form to submit a catering request.">
    <meta name="author" content="Clive Simbarashe Musika">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/small.css" media="screen and (max-width: 767px)">
    <link rel="stylesheet" href="styles/large.css" media="screen and (min-width: 768px)">
</head>
<body>
    <header>
        <h1>Crumb & Crust</h1>
        <button id="menu-toggle" aria-label="Toggle Menu">☰</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Our Menu</a></li>
                <li><a href="order.html" class="active">Catering Requests</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 style="color: var(--accent-honey); margin-bottom: 1.5rem; text-align: center;">Catering Pre-Order Customization</h2>
        <form action="thank-you.html" method="GET">
            <div class="form-group">
                <label for="name">Contact Name:</label>
                <input type="text" id="name" name="name" required placeholder="Clive Musika">
            </div>
            <div class="form-group">
                <label for="event-date">Event Date:</label>
                <input type="date" id="event-date" name="eventDate" required>
            </div>
            <div class="form-group">
                <label for="package">Select Assembly Tier:</label>
                <select id="package" name="package" required>
                    <option value="">--Choose a Platter Option--</option>
                    <option value="assorted-pastries">Morning Assorted Pastries Trio</option>
                    <option value="sourdough-charcuterie">Artisan Bread & Savory Pairing</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Special Requirements / Dietary Adjustments:</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Any allergy considerations or adjustments..."></textarea>
            </div>
            <button type="submit">Submit Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Clive Simbarashe Musika | Crumb & Crust Bakery</p>
        <p><a href="https://loom.com/your-video-link" target="_blank">Project Video Demo</a></p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
