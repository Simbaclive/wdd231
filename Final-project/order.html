<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering Order Requests | Crumb & Crust</title>
    <meta name="description" content="Organizing a workshop or morning meeting? Fill out our customization form to submit a catering request.">
    <meta name="author" content="Clive Simbarashe Musika">
    
    <meta property="og:title" content="Catering Order Requests | Crumb & Crust">
    <meta property="og:description" content="Organizing a workshop or morning meeting? Complete our custom planning sheet to register an event slot.">
    <meta property="og:image" content="https://simbaclive.github.io/wdd231/Final-project/images/main-image.jpg">
    <meta property="og:url" content="https://simbaclive.github.io/wdd231/Final-project/order.html">
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/small.css" media="screen and (max-width: 767px)">
    <link rel="stylesheet" href="styles/large.css" media="screen and (min-width: 768px)">
</head>
<body>
    <header>
        <div class="logo-area">Crumb & Crust</div>
        <button id="menu-toggle" aria-label="Toggle Menu">☰</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Our Menu</a></li>
                <li><a href="order.html" class="active">Catering Requests</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Catering Order Requests</h1>
        <h2 class="page-subtitle">Custom Event Planning Selection</h2>
        
        <form id="catering-form" action="thank-you.html" method="get">
            <div class="form-group">
                <label for="client-name">Full Name:</label>
                <input type="text" id="client-name" name="clientName" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="client-email">Email Address:</label>
                <input type="email" id="client-email" name="clientEmail" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="event-date">Event Date:</label>
                <input type="date" id="event-date" name="eventDate" required>
            </div>

            <div class="form-group">
                <label for="package-select">Catering Package Selection:</label>
                <select id="package-select" name="packageSelection" required>
                    <option value="" disabled selected>-- Select an option --</option>
                    <option value="breakfast">Morning Pastry Board Assortment</option>
                    <option value="sourdough">Artisan Bread & Spreads Platter</option>
                    <option value="dessert">Sweet Treat Celebration Platter</option>
                </select>
            </div>

            <div class="form-group">
                <label for="special-notes">Dietary Accommodations & Notes:</label>
                <textarea id="special-notes" name="specialNotes" rows="4" placeholder="List any specific allergen rules or custom adjustments here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Catering Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Clive Simbarashe Musika | Crumb & Crust Bakery</p>
        <p><a href="https://loom.com/your-video-link" target="_blank">Project Video Demo</a></p>
    </footer>

    <script type="module" src="scripts/main.js"></script>
</body>
</html>
